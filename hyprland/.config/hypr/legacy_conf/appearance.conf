# --- Estética e Decoração ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $mauve $lavender 45deg
    col.inactive_border = $surface0
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 0.98
    inactive_opacity = 0.88

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        special = true
    }

    shadow {
        enabled = yes
        range = 15
        render_power = 3
        color = rgba(11111b66)
    }
}

animations {
    enabled = true

    bezier = balanco, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 6, balanco, slide
    animation = windowsOut, 1, 6, balanco, slide
    animation = fade, 1, 6, balanco
    animation = workspaces, 1, 8, balanco, slidefade 20%
}

dwindle {
    preserve_split = yes
}

misc {
    disable_hyprland_qtutils_check = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
    enable_swallow = true
    swallow_regex = ^(kitty|alacritty)$
    focus_on_activate = false
}
