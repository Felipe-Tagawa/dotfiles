# Configuração do Hyprland para Linux Mint 22.3 com GPU Híbrida
# Configuração Hyprland para Linux Mint 22.3 (NVIDIA/AMD Hybrid)

# --- Monitores ---
monitor = eDP-1, 1920x1080@144,0x0,1
monitor = HDMI-A-1, 1920x1080@60, auto, 1

# --- Variáveis de Ambiente (NVIDIA & Wayland) ---
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = NVD_BACKEND,direct

# --- Inicialização ---
exec-once = ~/.config/waybar/start.sh
exec-once = ~/.config/hypr/scripts/border-animate.sh
exec-once = nm-applet
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swaync
exec-once = copyq
exec-once = ~/.config/hypr/scripts/start_notifications.sh

# --- Entrada ---
input {
    kb_layout = br, us
    kb_variant = abnt2, intl
    kb_model = abnt2
    
    repeat_delay = 300
    repeat_rate = 50
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = yes
        tap-to-click = yes
        scroll_factor = 0.5
    }
    sensitivity = 0
    accel_profile = flat
}

cursor {
    no_hardware_cursors = true
    no_warps = true
    inactive_timeout = 5
}

# --- Estética ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00000000) rgba(000000ee) 45deg
    col.inactive_border = rgba(00000080)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 0.98
    inactive_opacity = 0.88

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        special = true
    }

    shadow {
        enabled = yes
        range = 15
        render_power = 3
        color = rgba(00000040)
    }
}

animations {
    enabled = true

    bezier = balanco, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 6, balanco, slide
    animation = windowsOut, 1, 6, balanco, slide
    animation = fade, 1, 6, balanco
    animation = workspaces, 1, 8, balanco, slidefade 20%
}

# --- Layouts ---
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# --- Miscelânea ---
misc {
    disable_hyprland_qtutils_check = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true # Economia de bateria/recursos
    enable_swallow = true
    swallow_regex = ^(kitty|alacritty)$
    focus_on_activate = false
}

# --- Regras de Janela ---
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(blueman-manager)$
windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(copyq)$
windowrule = float, ^(galculator)$
windowrule = size 50% 50%, ^(copyq)$
windowrule = center, ^(copyq)$
windowrulev2 = stayfocused, title:^/.*,class:^(steam)$
windowrule = tile, ^(firefox)$

windowrulev2 = rounding 12, floating:1

layerrule = noanim, swaync
layerrule = blur, swaync
layerrule = ignorealpha 0.5, swaync

layerrule = animation popin 80%, rofi
layerrule = blur, rofi
layerrule = ignorealpha 0.5 rofi

layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar


# --- Atalhos Principais ($mod = Super/Windows) ---
$mod = SUPER

# Essenciais
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, thunar
bind = $mod, Space, togglefloating,
bind = $mod, F, fullscreen, 0,
bind = $mod, D, exec, ~/.config/rofi/launchers/type-3/launcher.sh
bind = $mod, L, exec, swaylock
bind = $mod, X, exec, wlogout -p layer-shell
bind = $mod, K, exec, hyprctl switchxkblayout all next
# Alternar entre monitor Estendido e Espelhado
bind = $mod, P, exec, hyprctl monitor "HDMI-A-1, 1920x1080@60, auto, 1, mirror, eDP-1" || hyprctl monitor "HDMI-A-1, 1920x1080@60, auto, 1"

# Aplicativos Rápidos
bind = $mod, F1, exec, firefox
bind = $mod, F4, exec, discord
bind = $mod, F7, exec, steam
bind = $mod, I, exec, kitty nvim

# Captura de Tela
bind = $mod, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Tela cheia copiada"
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Área copiada"

# Clipboard
bind = $mod, V, exec, ~/.config/hypr/scripts/clipboard_history.sh
bind = $mod SHIFT, V, exec, wl-paste | cliphist store && notify-send "Clipboard" "Salvo no histórico"
bind = $mod CTRL, V, exec, wl-paste --type image | cliphist store && notify-send "Clipboard" "Imagem salva"
bind = $mod CTRL SHIFT, V, exec, ~/.config/hypr/scripts/clipboard_clear.sh

# Multimídia e Brilho (com notificações)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume_notification.sh mute
binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume_notification.sh down
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume_notification.sh up
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness_notification.sh down
bind = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness_notification.sh up

# WiFi
bind = $mod, W, exec, ~/.config/hypr/scripts/wifi_menu.sh
bind = $mod CTRL, W, exec, ~/.config/hypr/scripts/wifi_toggle.sh
bind = $mod SHIFT, W, exec, nm-connection-editor
bind = $mod ALT, W, exec, ~/.config/hypr/scripts/wifi_status.sh
bind = $mod CTRL SHIFT, W, exec, ~/.config/hypr/scripts/wifi_disconnect.sh

# Navegação de Foco (Vim Style + Arrows)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, j, movefocus, d

# Movimentação de Janelas
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

# Workspaces (1-10)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Mover Janela para Workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspace Especial (Scratchpad)
bind = $mod, Grave, togglespecialworkspace, scratchpad
bind = $mod SHIFT, Grave, movetoworkspace, special:scratchpad

# Utilidades
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod, C, exec, hyprpicker | wl-copy
bind = $mod SHIFT, R, exec, killall waybar && hyprctl reload && ~/.config/waybar/start.sh
bind = $mod CTRL, G, exec, prime-select nvidia && notify-send "GPU" "Mudando para NVIDIA (Requer Logout)"
# --- Inicialização de Serviços e Background ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && ~/.config/hypr/scripts/wallpaper.sh
exec-once = ~/.config/hypr/scripts/clipboard_daemon.sh
