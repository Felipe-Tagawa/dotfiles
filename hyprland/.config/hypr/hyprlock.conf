# Hyprlock Configuration - Frosted Glass & Dynamic Material You

source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = $HOME/.config/hypr/.current_wallpaper
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.88
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

# RELÓGIO PRINCIPAL
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 80
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# DATA COMPLETA (pt-BR)
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B de %Y" | sed -e 's/\b\(.\)/\u\1/g')"
    color = $on_surface
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# STATUS DE BLOQUEIO / SESSÃO
label {
    monitor =
    text =   Sessão Bloqueada
    color = $on_surface_variant
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# CAMPO DE SENHA (MATERIAL YOU)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $outline
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono Nerd Font">󰌌  Digite sua senha...</span>
    hide_input = false
    rounding = 25
    check_color = $primary
    fail_color = $error
    fail_text = <i>Senha incorreta <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    capslock_color = $secondary
    position = 0, -55
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.25)
}

# STATUS DA BATERIA / SISTEMA
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/lock-status.sh
    color = $on_surface_variant
    font_size = 13
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 32
    halign = center
    valign = bottom
}
