# --- Monitores ---
monitor = eDP-1, 1920x1080@144,0x0,1
monitor = HDMI-A-1, 1920x1080@60, auto, 1

# --- Entrada ---
input {
    kb_layout = br, us
    kb_variant = abnt2, intl
    kb_model = abnt2
    
    repeat_delay = 300
    repeat_rate = 50
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = yes
        tap-to-click = yes
        scroll_factor = 0.5
    }
    sensitivity = 0
    accel_profile = flat
}

cursor {
    no_hardware_cursors = true
    no_warps = true
    inactive_timeout = 5
}
