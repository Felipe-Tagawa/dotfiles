# --- Inicialização ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/scripts/wallpaper.sh &
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Catppuccin-Mocha-Standard-Blue-Dark'
exec-once = ~/.config/waybar/start.sh
exec-once = ~/.config/hypr/scripts/border-animate.sh
exec-once = nm-applet
exec-once = blueman-applet
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = swaync
exec-once = copyq
exec-once = ~/.config/hypr/scripts/battery_notification.sh
exec-once = ~/.config/hypr/scripts/clipboard_daemon.sh
exec-once = ~/.config/hypr/scripts/check_updates
exec-once = hypridle
