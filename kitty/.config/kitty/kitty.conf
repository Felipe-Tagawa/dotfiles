


# BEGIN_KITTY_THEME
# Gruvbox Dark Hard
include /home/kyo/.config/kitty/themes/gruvboxd.conf
# END_KITTY_THEME

background_image ~/Pictures/Wallpapers/farol.png
background_image_layout scaled

background_image_linear yes
background_tint 0.5

cursor_shape beam

# Cor do cursor combinando com o Rosé Pine Iris (Roxo)
cursor #957fb8

font_family      JetBrainsMono Nerd Font
font_size        12.0
disable_ligatures never

# Mapeia os glifos da Nerd Font para um tamanho específico
# Isso evita que eles "empurrem" a linha para cima
symbol_map U+E000-U+E7C7,U+F000-U+F2E0 JetBrainsMono Nerd Font

# Diminui um pouco a escala dos glifos se eles estiverem gigantes
narrow_symbols U+E000-U+E7C7,U+F000-U+F2E0 1
